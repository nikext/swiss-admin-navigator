# Workspace root. Members are virtual uv projects (no build system): each one
# declares its own runtime deps, and code is imported from the repo root
# (`ingest.parse`, `agents.navigator.config`, ...). See ADR-011.
[project]
name = "swiss-admin-navigator"
version = "0.0.0"
description = "Multilingual, citation-grounded agent over Swiss federal law. Unofficial. Not legal advice."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ingest", "mcp_server", "agents/navigator", "evals"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["cache", "data"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PTH",           # pathlib
    "PT",            # pytest style
    "S",             # bandit
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

# --- pyright ----------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["ingest", "mcp_server", "agents", "evals", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "cache", "data"]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["ingest", "mcp_server", "agents", "evals", "scripts"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not integration"]
asyncio_mode = "auto"
markers = ["integration: needs network or GCP credentials (run with `-m integration`)"]
