name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install deps (locked)
        run: uv sync --all-packages --locked

      - name: pre-commit hooks (hygiene, secrets, ruff)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint + typecheck
        run: make lint

      - name: Unit tests
        run: make test
