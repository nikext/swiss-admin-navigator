# queries/latest_consolidations.rq. `eli` is the in-force ConsolidationAbstract.
# `xml_langs` lists the languages with an XML file for the consolidation that
# applied on 2026-10-15. Re-resolve in M1, because consolidation dates move.
#
# DE, FR and IT texts are equally authoritative. EN translations are
# UNOFFICIAL, exist for only a few acts, and often lag the current
# consolidation. See docs/DATA.md.
#
# `domain` routes questions to a specialist agent in M8. See docs/AGENTS.md.

