# v1 corpus: Swiss FEDERAL acts relevant to people living and working in
# Switzerland. `eli` is the in-force ConsolidationAbstract; `make resolve`
# checks it against Fedlex (SR numbers get reused). Consolidation dates, file
# URLs, languages and checksums live in manifest.lock.json, not here.
#
# DE, FR and IT texts are equally authoritative. EN translations are
# UNOFFICIAL, exist for only a few acts, and often lag the current
# consolidation. See docs/DATA.md.
#
# `domain` routes questions to a specialist agent in M8. See docs/AGENTS.md.

