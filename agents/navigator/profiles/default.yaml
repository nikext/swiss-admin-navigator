# Model profile (ADR-008): the only place model IDs live. Each role names a
# model and the Agent Platform endpoint location that serves it (ADR-013).
# Live-checked 2026-10-15 with ADC: none of these models is served in
# europe-west6 or any single EU region for this project. `eu` (processing
# within EU member states, which excludes Switzerland) serves agent and
# embedding. The judge runs on `global`, where the judge study measured it.
# Judge choice: ADR-023 (judge study 2026-10-15). Re-check with `make smoke-gemini`.
agent:
  model: gemini-3.8-flash
  location: eu
judge:
  model: gemini-3.8-flash
  location: global
embedding:
  model: gemini-embedding-2
  location: eu
  # Task hint goes into the text; this model ignores task_type (ADR-015).
  input_format: instruction
# Memory Bank's extraction model (M7, ADR-029). Unset, Memory Bank's default took 281-360 s
# per generate call on the europe-west6 instance; this one 13 s. `eu` was accepted but
# generated nothing (2026-10-16). Memory Bank processes on global endpoints either way.
memory:
  model: gemini-3.8-flash
  location: global
# navigator_v2's router and the LLM claim checker (M8, ADR-030), on the agent's endpoint.
# Both at thinking low: this model rejects THINKING_LEVEL_MINIMAL (400, 2026-10-16).
router:
  model: gemini-3.8-flash
  location: eu
  thinking: low
verifier:
  model: gemini-3.8-flash
  location: eu
  thinking: low
