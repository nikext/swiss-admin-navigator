# Keep the ruff rev in sync with the ruff pin in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^ingest/tests/fixtures/  # verbatim Fedlex XML
      - id: trailing-whitespace
        exclude: ^ingest/tests/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Full eval reports (answers + judgements, ~1.5 MB for 150 cases) are the evidence;
        # the README demo GIF (M11, ADR-036) is ~5.6 MB.
        exclude: ^(evals/reports/.*\.json|docs/media/.*\.gif)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-secrets
        name: block .env files and GCP key/credential JSON
        entry: python scripts/check_no_secrets.py
        language: python
